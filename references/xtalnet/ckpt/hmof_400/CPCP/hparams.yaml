data:
  root_path: /vepfs/fs_users/qingsi/dataset/pxrd/lmdb_data/20240103_full_hmof
  max_atoms: 100
  train_max_epochs: 400
  early_stopping_patience: 100000
  use_pxrd: true
  pretrained: ''
  ckpt_path: null
  datamodule:
    _target_: xtalnet.pl_data.datamodule.CrystDataModule
    datasets:
      train:
        _target_: xtalnet.pl_data.dataset.CrystMOFLMDBDataset
        name: xtalnet train
        path: ${data.root_path}/train.lmdb
        use_pxrd: ${data.use_pxrd}
        is_training: true
      val:
      - _target_: xtalnet.pl_data.dataset.CrystMOFLMDBDataset
        name: xtalnet val
        path: ${data.root_path}/val.lmdb
        use_pxrd: ${data.use_pxrd}
        is_training: false
      test:
      - _target_: xtalnet.pl_data.dataset.CrystMOFLMDBDataset
        name: xtalnet test
        path: ${data.root_path}/test.lmdb
        use_pxrd: ${data.use_pxrd}
        is_training: false
    num_workers:
      train: 8
      val: 8
      test: 8
    batch_size:
      train: 8
      val: 1
      test: 1
model:
  pxrd_encoder:
    _target_: xtalnet.pl_modules.bert.BertModel
    max_seq_len: 2048
  crystal_encoder:
    _target_: xtalnet.pl_modules.cpcp_module.CSPCPCPNet
    hidden_dim: 512
    max_atoms: 100
    num_layers: 6
    act_fn: silu
    dis_emb: sin
    num_freqs: 128
    edge_style: fc
    ln: true
    ip: true
  _target_: xtalnet.pl_modules.cpcp_module.CPCPModule
  latent_dim: 512
  freeze_pxrd_encoder: false
core:
  version: 0.0.1
  tags:
  - ${now:%Y-%m-%d}
